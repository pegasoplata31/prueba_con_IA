# ============================================================
#  build-apk.yml — Workflow de compilación de Beyond Words
#  Compila el APK con ML Kit (traducción) y Gemma 3 1B (gramática).
# ============================================================

name: Build Beyond Words APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-android:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Guante-De-Voz-App

    steps:
      # 1) Descarga el repositorio
      - name: Descargar proyecto
        uses: actions/checkout@v4

      # 2) Instala Java 17
      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3) Instala Flutter
      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 4) Verifica estructura
      - name: Verificar estructura
        run: |
          pwd
          ls -la
          test -f pubspec.yaml
          test -f lib/main.dart
          ls -la lib/

      # 5) Verifica Flutter
      - name: Verificar Flutter
        run: |
          flutter --version
          dart --version

      # 6) Descarga dependencias
      - name: Instalar dependencias
        run: flutter pub get

      # 7) Genera la carpeta android/ desde cero
      - name: Generar plataforma Android
        run: |
          rm -rf /tmp/bw_android
          flutter create \
            --platforms=android \
            --org com.beyondword \
            --project-name beyond_words \
            /tmp/bw_android
          rm -rf android
          cp -R /tmp/bw_android/android ./android

      # 8) Fuerza compileSdk 36 / targetSdk 34 / minSdk 24
      #    Gemma 3 1B requiere minSdk 24 (no 23) para LiteRT-LM.
      - name: Configurar compileSdk 36, targetSdk 34 y minSdk 24
        run: |
          GRADLE_FILE=$(find android/app -name "build.gradle.kts" -o -name "build.gradle" | head -n 1)
          echo "Gradle file encontrado: $GRADLE_FILE"
          if [[ "$GRADLE_FILE" == *.kts ]]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' "$GRADLE_FILE" || true
            sed -i 's/compileSdk = [0-9]*/compileSdk = 36/' "$GRADLE_FILE" || true
            sed -i 's/targetSdk = flutter.targetSdkVersion/targetSdk = 34/' "$GRADLE_FILE" || true
            sed -i 's/targetSdk = [0-9]*/targetSdk = 34/' "$GRADLE_FILE" || true
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' "$GRADLE_FILE" || true
            sed -i 's/minSdk = [0-9]*/minSdk = 24/' "$GRADLE_FILE" || true
          else
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/' "$GRADLE_FILE" || true
            sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 36/' "$GRADLE_FILE" || true
            sed -i 's/targetSdkVersion flutter.targetSdkVersion/targetSdkVersion 34/' "$GRADLE_FILE" || true
            sed -i 's/targetSdkVersion [0-9]*/targetSdkVersion 34/' "$GRADLE_FILE" || true
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' "$GRADLE_FILE" || true
            sed -i 's/minSdkVersion [0-9]*/minSdkVersion 24/' "$GRADLE_FILE" || true
          fi
          cat "$GRADLE_FILE"

      # 9) Fuerza compileSdk 36 en el build.gradle raíz
      - name: Configurar compileSdk en build.gradle raíz
        run: |
          if [ -f android/build.gradle ]; then
            sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 36/' android/build.gradle || true
          fi
          if [ -f android/build.gradle.kts ]; then
            sed -i 's/compileSdk = [0-9]*/compileSdk = 36/' android/build.gradle.kts || true
          fi

      # 10) Fuerza compileSdk 36 y minSdk 24 en gradle.properties
      - name: Forzar compileSdk 36 en gradle.properties
        run: |
          cat >> android/gradle.properties <<'EOF'

          android.compileSdkVersion=36
          android.targetSdkVersion=34
          android.minSdkVersion=24
          EOF
          cat android/gradle.properties

      # 11) Init script de Gradle para forzar compileSdk 36 en plugins
      - name: Crear init script de Gradle en HOME
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/force-compile-sdk.gradle <<'EOF'
          allprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          compileSdkVersion 36
                      }
                  }
              }
          }
          EOF

      # 12) AndroidManifest con permisos BLE + ML Kit + Gemma
      - name: Escribir AndroidManifest con permisos BLE, ML Kit y Gemma
        run: |
          mkdir -p android/app/src/main
          cat > android/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <!-- Permisos BLE Android 12+ -->
              <uses-permission
                  android:name="android.permission.BLUETOOTH_SCAN"
                  android:usesPermissionFlags="neverForLocation" />
              <uses-permission
                  android:name="android.permission.BLUETOOTH_CONNECT" />

              <!-- Permisos BLE Android 11 e inferiores -->
              <uses-permission
                  android:name="android.permission.BLUETOOTH"
                  android:maxSdkVersion="30" />
              <uses-permission
                  android:name="android.permission.BLUETOOTH_ADMIN"
                  android:maxSdkVersion="30" />
              <uses-permission
                  android:name="android.permission.ACCESS_FINE_LOCATION"
                  android:maxSdkVersion="30" />

              <!-- Permisos de red para ML Kit y Gemma -->
              <uses-permission
                  android:name="android.permission.INTERNET" />
              <uses-permission
                  android:name="android.permission.ACCESS_NETWORK_STATE" />

              <uses-feature
                  android:name="android.hardware.bluetooth_le"
                  android:required="true" />

              <application
                  android:label="Beyond Words"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:largeHeap="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:taskAffinity=""
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                          android:name="io.flutter.embedding.android.NormalTheme"
                          android:resource="@style/NormalTheme" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>
          EOF
          cat android/app/src/main/AndroidManifest.xml

      # 13) Restaura dependencias
      - name: Restaurar dependencias
        run: flutter pub get

      # 14) Analiza el código (no bloquea la compilación)
      - name: Analizar
        run: flutter analyze || true

      # 15) Compila el APK release
      - name: Compilar APK release
        run: flutter build apk --release --no-tree-shake-icons

      # 16) Verifica APK
      - name: Verificar APK
        run: |
          ls -lh build/app/outputs/flutter-apk/
          test -f build/app/outputs/flutter-apk/app-release.apk

      # 17) Sube el APK
      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: Beyond-Words-APK
          path: Guante-De-Voz-App/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
